<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นักสำรวจตัวน้อย: ภารกิจสืบตลาด</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Mitr', sans-serif;
            background-color: #f0fdf4; /* bg-green-50 */
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 30px 30px;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .float-anim {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .item-clickable {
            transition: all 0.2s;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .item-clickable:hover {
            transform: scale(1.15) rotate(5deg);
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.2));
        }

        .item-found {
            opacity: 0.5;
            filter: grayscale(100%);
            pointer-events: none;
            transform: scale(0.9);
        }

        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.3s; }
        
        .market-bg {
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 40%, #e5e7eb 40%, #e5e7eb 100%);
            border-radius: 1rem;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* Confetti Canvas */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Confetti layer -->
    <canvas id="confetti"></canvas>

    <div id="app-container" class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col relative h-[90vh] max-h-[800px]">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-green-400 to-emerald-500 p-4 text-white flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-full text-green-500">
                    <i class="ph-fill ph-magnifying-glass text-2xl"></i>
                </div>
                <h1 class="text-xl md:text-2xl font-semibold">นักสำรวจตัวน้อย</h1>
            </div>
            <button id="btn-home" class="hidden bg-white/20 hover:bg-white/30 px-4 py-2 rounded-full text-sm font-medium transition-colors duration-200 flex items-center gap-2">
                <i class="ph-bold ph-house"></i> หน้าหลัก
            </button>
        </div>

        <!-- Main Content Area -->
        <div id="main-content" class="flex-1 flex flex-col relative overflow-y-auto p-4 md:p-6 bg-slate-50">
            <!-- Dynamic content will be injected here -->
        </div>

    </div>

    <!-- Custom Modal System -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-md w-full mx-4 transform scale-90 transition-transform duration-300 flex flex-col items-center text-center">
            <div id="modal-icon" class="text-6xl mb-4 bounce-in">🌟</div>
            <h2 id="modal-title" class="text-2xl font-bold text-gray-800 mb-2">ยอดเยี่ยม!</h2>
            <p id="modal-desc" class="text-gray-600 mb-6 text-lg">คุณทำภารกิจสำเร็จแล้ว</p>
            <button id="modal-close" class="bg-gradient-to-r from-green-400 to-emerald-500 text-white font-semibold py-3 px-8 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all w-full text-lg">
                ตกลง
            </button>
        </div>
    </div>

    <script>
        // Game Data Structure
        const gameData = {
            food: {
                id: 'food',
                title: 'อาหาร',
                icon: '🍜',
                color: 'from-orange-400 to-red-500',
                desc: 'สำรวจร้านอาหารปรุงสำเร็จ',
                bgTheme: 'bg-orange-100',
                items: [
                    { id: 'f1', name: 'ก๋วยเตี๋ยวร้อนๆ', emoji: '🍜', x: 20, y: 60, found: false, detail: 'อาหารปรุงสุกใหม่ สะอาด น่าทาน' },
                    { id: 'f2', name: 'ลูกชิ้นปิ้ง', emoji: '🍢', x: 70, y: 55, found: false, detail: 'ระวังอย่าให้มีแมลงวันตอมนะ' },
                    { id: 'f3', name: 'น้ำแข็งใส', emoji: '🍧', x: 50, y: 75, found: false, detail: 'สังเกตความสะอาดของน้ำแข็งด้วยนะ' }
                ]
            },
            fresh: {
                id: 'fresh',
                title: 'ผัก ผลไม้ เนื้อสัตว์',
                icon: '🥦',
                color: 'from-green-400 to-teal-500',
                desc: 'ความสดใหม่ของวัตถุดิบ',
                bgTheme: 'bg-green-100',
                items: [
                    { id: 'fr1', name: 'ผักใบเขียว', emoji: '🥬', x: 15, y: 70, found: false, detail: 'ผักสดไม่เหี่ยว ไม่มีรอยหนอนเจาะมากเกินไป' },
                    { id: 'fr2', name: 'เนื้อหมู/เนื้อไก่', emoji: '🥩', x: 80, y: 65, found: false, detail: 'สีต้องสดตามธรรมชาติ ไม่มีกลิ่นเหม็น' },
                    { id: 'fr3', name: 'ผลไม้ตามฤดูกาล', emoji: '🍉', x: 45, y: 60, found: false, detail: 'ผิวสวย ไม่ช้ำ จัดวางอย่างเป็นระเบียบ' }
                ]
            },
            merchant: {
                id: 'merchant',
                title: 'พ่อค้า แม่ค้า',
                icon: '👩‍🌾',
                color: 'from-blue-400 to-indigo-500',
                desc: 'การบริการและการแต่งกาย',
                bgTheme: 'bg-blue-100',
                items: [
                    { id: 'm1', name: 'รอยยิ้มทักทาย', emoji: '😊', x: 30, y: 40, found: false, detail: 'พ่อค้าแม่ค้ายิ้มแย้ม พูดจาไพเราะ' },
                    { id: 'm2', name: 'ป้ายราคา', emoji: '🏷️', x: 60, y: 45, found: false, detail: 'มีป้ายบอกราคาชัดเจน ไม่ต้องเดา' },
                    { id: 'm3', name: 'ผ้ากันเปื้อน', emoji: '🎽', x: 45, y: 80, found: false, detail: 'แต่งกายสะอาด สวมผ้ากันเปื้อน/หมวก' }
                ]
            },
            waste: {
                id: 'waste',
                title: 'ขยะ',
                icon: '🗑️',
                color: 'from-gray-500 to-slate-700',
                desc: 'การจัดการขยะในตลาด',
                bgTheme: 'bg-slate-200',
                items: [
                    { id: 'w1', name: 'ถังขยะส่วนกลาง', emoji: '🗑️', x: 20, y: 75, found: false, detail: 'มีถังขยะวางเป็นจุดๆ และไม่ล้น' },
                    { id: 'w2', name: 'ขยะบนพื้น', emoji: '🥤', x: 75, y: 85, found: false, detail: 'มีขยะตกหล่นบนทางเดินหรือไม่?' },
                    { id: 'w3', name: 'การแยกขยะ', emoji: '♻️', x: 50, y: 55, found: false, detail: 'สังเกตว่ามีการแยกขยะเปียก ขยะแห้งไหม' }
                ]
            },
            clean: {
                id: 'clean',
                title: 'ความสะอาด',
                icon: '✨',
                color: 'from-cyan-400 to-blue-500',
                desc: 'สภาพแวดล้อมโดยรวม',
                bgTheme: 'bg-cyan-100',
                items: [
                    { id: 'c1', name: 'ทางเดินแห้ง', emoji: '🚶', x: 35, y: 80, found: false, detail: 'พื้นตลาดไม่แฉะ เดินได้อย่างปลอดภัย' },
                    { id: 'c2', name: 'แมลงวัน/หนู', emoji: '🪰', x: 65, y: 40, found: false, detail: 'สังเกตสัตว์พาหะนำโรคบริเวณแผงขาย' },
                    { id: 'c3', name: 'จุดล้างมือ', emoji: '💧', x: 85, y: 70, found: false, detail: 'มีอ่างล้างมือสำหรับพ่อค้าและลูกค้า' }
                ]
            }
        };

        // App State
        let currentTopic = null;
        const state = {
            progress: {} // tracks found items
        };

        // Initialize progress
        Object.keys(gameData).forEach(key => {
            state.progress[key] = [];
        });

        const mainContent = document.getElementById('main-content');
        const btnHome = document.getElementById('btn-home');
        
        // Modal Elements
        const modal = document.getElementById('custom-modal');
        const modalContent = modal.querySelector('div');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalClose = document.getElementById('modal-close');

        btnHome.addEventListener('click', renderHome);
        
        modalClose.addEventListener('click', closeModal);

        function renderHome() {
            currentTopic = null;
            btnHome.classList.add('hidden');
            
            let html = `
                <div class="text-center mt-4 mb-8 bounce-in">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">เลือกภารกิจที่ต้องการสำรวจ</h2>
                    <p class="text-gray-500">แตะที่หัวข้อเพื่อเริ่มค้นหาข้อมูลในตลาดกันเลย!</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 px-2">
            `;

            Object.values(gameData).forEach((topic, index) => {
                const totalItems = topic.items.length;
                const foundItems = state.progress[topic.id].length;
                const isComplete = foundItems === totalItems;
                
                html += `
                    <div onclick="startTopic('${topic.id}')" 
                         class="bg-white rounded-2xl p-4 shadow-sm border-2 ${isComplete ? 'border-green-400 bg-green-50' : 'border-transparent hover:border-green-300'} 
                                cursor-pointer transform transition-all duration-300 hover:-translate-y-2 hover:shadow-lg flex items-center gap-4 group"
                         style="animation: bounceIn 0.5s ease forwards ${index * 0.1}s; opacity: 0;">
                        <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl bg-gradient-to-br ${topic.color} flex items-center justify-center text-3xl md:text-4xl shadow-inner group-hover:scale-110 transition-transform">
                            ${topic.icon}
                        </div>
                        <div class="flex-1 text-left">
                            <h3 class="text-lg md:text-xl font-bold text-gray-800 flex items-center gap-2">
                                ${topic.title}
                                ${isComplete ? '<i class="ph-fill ph-check-circle text-green-500"></i>' : ''}
                            </h3>
                            <p class="text-sm text-gray-500 line-clamp-1">${topic.desc}</p>
                            <div class="mt-2 w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-green-500 h-2 rounded-full transition-all duration-500" style="width: ${(foundItems/totalItems)*100}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                </div>
                
                <div class="mt-auto pt-8 pb-4 text-center">
                    <button onclick="showSummary()" class="bg-gray-800 hover:bg-gray-700 text-white px-8 py-3 rounded-full font-semibold shadow-lg transition-all hover:scale-105 flex items-center gap-2 mx-auto">
                        <i class="ph-fill ph-clipboard-text text-xl"></i> สรุปผลการสำรวจ
                    </button>
                </div>
            `;

            mainContent.innerHTML = html;
        }

        window.startTopic = function(topicId) {
            currentTopic = gameData[topicId];
            btnHome.classList.remove('hidden');
            renderGameScene();
        }

        function renderGameScene() {
            const topic = currentTopic;
            const foundCount = state.progress[topic.id].length;
            const totalCount = topic.items.length;

            let html = `
                <div class="flex items-center justify-between mb-4 bg-white p-4 rounded-2xl shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${topic.color} flex items-center justify-center text-2xl">
                            ${topic.icon}
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-gray-800">ภารกิจ: ${topic.title}</h2>
                            <p class="text-sm text-gray-500">ค้นหาสิ่งเหล่านี้ในตลาดให้ครบ</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-bold text-green-500">${foundCount}</span>
                        <span class="text-gray-400 text-lg">/ ${totalCount}</span>
                    </div>
                </div>

                <!-- Market Scene -->
                <div class="market-bg flex-1 w-full min-h-[300px] mb-4 relative ${topic.bgTheme}">
                    <!-- Sun/Cloud Deco -->
                    <div class="absolute top-4 right-8 text-4xl opacity-50 float-anim">☀️</div>
                    <div class="absolute top-10 left-10 text-4xl opacity-30 float-anim" style="animation-delay: 1s">☁️</div>
                    
                    <!-- Market Stalls Deco -->
                    <div class="absolute bottom-0 w-full h-1/2 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2QxZDVkYiIgLz48cGF0aCBkPSJNMCA1MCBMMTAwIDUwIiBzdHJva2U9IiM5Y2EzYWYiIHN0cm9rZS13aWR0aD0iMiIgLz48L3N2Zz4=')] opacity-20"></div>
            `;

            // Render Items in Scene
            topic.items.forEach((item, index) => {
                const isFound = state.progress[topic.id].includes(item.id);
                html += `
                    <div id="scene-item-${item.id}" 
                         onclick="handleItemClick('${item.id}')"
                         class="absolute text-5xl md:text-6xl ${isFound ? 'item-found' : 'item-clickable float-anim'}"
                         style="left: ${item.x}%; top: ${item.y}%; transform: translate(-50%, -50%); animation-delay: ${index * 0.5}s;">
                        ${item.emoji}
                        ${isFound ? '<div class="absolute -top-2 -right-2 bg-green-500 text-white rounded-full p-1 text-xs"><i class="ph-bold ph-check"></i></div>' : ''}
                    </div>
                `;
            });

            html += `
                </div>

                <!-- Checklist Notebook -->
                <div class="bg-yellow-50 rounded-2xl p-4 shadow-sm border border-yellow-200">
                    <h3 class="font-bold text-yellow-800 mb-3 flex items-center gap-2">
                        <i class="ph-fill ph-notebook text-xl"></i> สมุดบันทึกนักสืบ
                    </h3>
                    <div class="flex flex-col gap-2">
            `;

            // Render Checklist
            topic.items.forEach(item => {
                const isFound = state.progress[topic.id].includes(item.id);
                html += `
                    <div class="flex items-center gap-3 bg-white p-3 rounded-xl border ${isFound ? 'border-green-200 bg-green-50' : 'border-gray-100'} transition-colors">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center ${isFound ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-400'}">
                            ${isFound ? '<i class="ph-bold ph-check"></i>' : item.emoji}
                        </div>
                        <div class="flex-1">
                            <h4 class="font-semibold text-gray-800 ${isFound ? 'line-through text-gray-400' : ''}">${item.name}</h4>
                            ${isFound ? `<p class="text-xs text-green-600 mt-1">${item.detail}</p>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            mainContent.innerHTML = html;
        }

        window.handleItemClick = function(itemId) {
            const topicId = currentTopic.id;
            const item = currentTopic.items.find(i => i.id === itemId);
            
            if (state.progress[topicId].includes(itemId)) return; // Already found

            // Add to progress
            state.progress[topicId].push(itemId);
            
            // Show item detail modal
            showModal(item.emoji, `ค้นพบ: ${item.name}`, item.detail, () => {
                // Re-render scene to update UI
                renderGameScene();
                
                // Check if topic is complete
                if (state.progress[topicId].length === currentTopic.items.length) {
                    setTimeout(() => {
                        fireConfetti();
                        showModal('🏆', 'ภารกิจสำเร็จ!', `คุณสำรวจหมวด "${currentTopic.title}" ครบถ้วนแล้ว เก่งมากนักสืบ!`, () => {
                            renderHome();
                        });
                    }, 500);
                }
            });
        }

        window.showSummary = function() {
            let totalFound = 0;
            let totalItems = 0;
            
            Object.values(gameData).forEach(topic => {
                totalFound += state.progress[topic.id].length;
                totalItems += topic.items.length;
            });

            let badge = '🕵️‍♂️ นักสืบฝึกหัด';
            let message = 'พยายามเข้า! ยังมีเบาะแสให้หาอีกเยอะเลย';
            
            if (totalFound === totalItems) {
                badge = '🌟 สุดยอดนักสืบตลาดสด';
                message = 'คุณสำรวจตลาดได้อย่างละเอียดถี่ถ้วนมาก!';
                fireConfetti();
            } else if (totalFound >= totalItems / 2) {
                badge = '🔍 นักสืบตาไว';
                message = 'คุณสังเกตเห็นหลายอย่างเลย เก่งมาก!';
            }

            btnHome.classList.remove('hidden');

            mainContent.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center text-center bounce-in">
                    <div class="text-6xl mb-4 bg-yellow-100 w-32 h-32 flex items-center justify-center rounded-full shadow-inner mx-auto border-4 border-white">
                        ${badge.split(' ')[0]}
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">ผลการสำรวจ</h2>
                    <h3 class="text-xl font-semibold text-green-600 mb-4">ระดับ: ${badge.substring(2)}</h3>
                    
                    <div class="bg-white rounded-2xl p-6 shadow-sm w-full max-w-sm mb-6 border border-gray-100">
                        <p class="text-gray-500 mb-2">ข้อมูลที่รวบรวมได้</p>
                        <div class="text-5xl font-bold text-gray-800 mb-2">
                            ${totalFound} <span class="text-2xl text-gray-400">/ ${totalItems}</span>
                        </div>
                        <p class="text-gray-600 text-sm">${message}</p>
                    </div>

                    <div class="w-full max-w-sm space-y-3">
                        ${Object.values(gameData).map(topic => `
                            <div class="flex justify-between items-center bg-gray-50 px-4 py-2 rounded-xl">
                                <span class="flex items-center gap-2"><span class="text-xl">${topic.icon}</span> ${topic.title}</span>
                                <span class="font-bold ${state.progress[topic.id].length === topic.items.length ? 'text-green-500' : 'text-gray-500'}">
                                    ${state.progress[topic.id].length}/${topic.items.length}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        let modalCallback = null;

        function showModal(icon, title, desc, callback) {
            modalIcon.textContent = icon;
            modalTitle.textContent = title;
            modalDesc.textContent = desc;
            modalCallback = callback;
            
            modal.classList.remove('hidden');
            // Trigger reflow
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-90', 'opacity-0');
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-90');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                if (modalCallback) {
                    modalCallback();
                    modalCallback = null;
                }
            }, 300);
        }

        // Simple Confetti implementation
        function fireConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d', '#00e1cc'];

            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -20 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }

            let animationId;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;

                particles.forEach(p => {
                    p.tiltAngle += p.tiltAngleInc;
                    p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle) * 2;
                    p.dy += 0.5; // gravity
                    p.x += p.dx;
                    p.y += p.dy;

                    if (p.y <= canvas.height) {
                        active = true;
                    }

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                });

                if (active) {
                    animationId = requestAnimationFrame(draw);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            
            draw();
            setTimeout(() => cancelAnimationFrame(animationId), 5000); // Stop after 5s
        }

        // Initialize App
        window.onload = () => {
            renderHome();
        };

    </script>
</body>
</html>
